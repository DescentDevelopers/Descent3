apply plugin: 'com.android.application'

repositories {
  mavenCentral()
}

apply from: "host-tools.gradle"

android {
  namespace = "com.descent3.droid"
  compileSdk = 34
  defaultConfig {
    minSdkVersion = 32
    targetSdkVersion = 34
    versionCode = 1
    versionName = "1.0"
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_APP_PLATFORM=android-19",
                  "-DANDROID_STL=c++_static",
                  "-DENABLE_LOGGER=ON",
                  "-DHOGMAKE_BINARY=${hogMakerBinary.get().asFile.absolutePath}"
        // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        abiFilters 'arm64-v8a'
      }
    }
  }
  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }
  buildTypes {
    release {
      minifyEnabled = false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  sourceSets {
    main {
      jniLibs.srcDir 'libs'
      java.srcDirs = ['src/main/java']
    }
  }
  externalNativeBuild {
    cmake {
      path "${rootProject.layout.projectDirectory}/CMakeLists.txt"
    }
  }
  lint {
    abortOnError = false
  }
}

// Copies the files CMake generates (d3-android.hog, online/*.d3c) into a generated assets
// directory under "gamedata/". MainActivity extracts them to the filesystem at runtime, since
// the game opens them with plain fopen().
// NOTE: the HOG contains ABI-specific script libraries, so this only works with a single ABI in
// abiFilters; multiple ABIs would need per-ABI asset paths.
androidComponents {
  onVariants(selector().all()) { variant ->
    def cap = variant.name.capitalize()
    def cmakeOutputDir = layout.buildDirectory.dir("intermediates/d3_generated/${variant.name}")
    variant.externalNativeBuild.arguments.add(
      cmakeOutputDir.map { "-DD3_GENERATED_FILES_OUTPUT_DIRECTORY=${it.asFile.absolutePath}" })

    // AGP picks the location and sets this property; the Sync task writes into it.
    def assetsDir = objects.directoryProperty()
    def stage = tasks.register("stage${cap}GameDataAssets", Sync) {
      dependsOn "externalNativeBuild${cap}"
      from(cmakeOutputDir) { into "gamedata" }
      into assetsDir
      // Required: marks this task as assetsDir's producer, so AGP's merge task depends on it.
      outputs.dir(assetsDir)
    }
    variant.sources.assets.addGeneratedSourceDirectory(stage, { assetsDir })
  }
}

dependencies {
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation 'org.nanohttpd:nanohttpd:2.2.0'
  implementation 'commons-io:commons-io:2.18.0'
}
